    }
    const toast=document.getElementById('toast');
    if(toast){toast.setAttribute('role','status');toast.setAttribute('aria-live','polite');toast.setAttribute('aria-atomic','true');}
    const backdrop=document.querySelector('#modalBack,#modalBackdrop');
    const dialog=backdrop&&backdrop.querySelector('.modal,.modalbox');
    let wasOpen=false,returnFocus=null,scheduled=false;
    const visible=element=>!!element&&element.getClientRects().length>0&&getComputedStyle(element).visibility!=='hidden';
    const focusables=()=>Array.from(dialog.querySelectorAll('button,a[href],input,select,textarea,[tabindex]')).filter(el=>!el.disabled&&el.tabIndex>=0&&visible(el));
    function enhance(){
      scheduled=false;
      document.querySelectorAll('label').forEach(label=>{
        if(label.htmlFor||label.querySelector('input,select,textarea'))return;
        const control=label.parentElement.querySelector('input[id],select[id],textarea[id]');
        if(control)label.htmlFor=control.id;
      });
      document.querySelectorAll('input[placeholder],textarea[placeholder],select').forEach(control=>{
        if(control.labels?.length||control.hasAttribute('aria-label')||control.hasAttribute('aria-labelledby'))return;
        const names={requestStatus:'Filter requests by status',requestSearch:'Search requests',tutorSearch:'Search tutors'};
        const name=names[control.id]||control.getAttribute('placeholder');
        if(name)control.setAttribute('aria-label',name);
      });
      document.querySelectorAll('button[title]').forEach(button=>{if(!button.hasAttribute('aria-label'))button.setAttribute('aria-label',button.title);});
      document.querySelectorAll('th').forEach(th=>{if(!th.hasAttribute('scope'))th.setAttribute('scope','col');});
      document.querySelectorAll('tr.clickable[onclick]').forEach(row=>{row.tabIndex=0;row.setAttribute('aria-label','Open details: '+row.textContent.trim().replace(/\s+/g,' '));});
      document.querySelectorAll('.navBtn[data-view],.nav button[data-view]').forEach(button=>{
        if(button.classList.contains('active'))button.setAttribute('aria-current','page');
        else button.removeAttribute('aria-current');
      });
      document.querySelectorAll('.tablewrap,.tableWrap').forEach(table=>{
        if(table.scrollWidth>table.clientWidth){table.tabIndex=0;table.setAttribute('role','region');table.setAttribute('aria-label','Scrollable table');}
      });
      if(!dialog)return;
      const open=visible(backdrop);
      if(open&&!wasOpen){
        returnFocus=document.activeElement;
        dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');dialog.tabIndex=-1;
        const heading=dialog.querySelector('#modalTitle,h1,h2,h3,.modaltitle');
        if(heading){if(!heading.id)heading.id='nhsDialogTitle';dialog.setAttribute('aria-labelledby',heading.id);}
        else dialog.setAttribute('aria-label','Details');
        (focusables()[0]||dialog).focus();
      }else if(!open&&wasOpen&&returnFocus?.isConnected){returnFocus.focus();}
      wasOpen=open;
    }
    document.addEventListener('keydown',event=>{
      if(dialog&&visible(backdrop)){
        if(event.key==='Escape'&&typeof closeModal==='function'){event.preventDefault();closeModal();return;}
        if(event.key==='Tab'){
          const items=focusables(),first=items[0]||dialog,last=items.at(-1)||dialog;
          if(!items.length||(event.shiftKey&&(document.activeElement===first||document.activeElement===dialog))||(!event.shiftKey&&document.activeElement===last)){
            event.preventDefault();(event.shiftKey?last:first).focus();
          }
        }
      }
      const row=event.target.closest('tr.clickable[onclick]');
      if(row&&event.target===row&&(event.key==='Enter'||event.key===' ')){event.preventDefault();row.click();}
    });
    document.addEventListener('invalid',event=>{
      const field=event.target;if(!field.id)return;
      field.setAttribute('aria-invalid','true');
      let error=document.getElementById(field.id+'Error');
      if(!error){error=document.createElement('div');error.id=field.id+'Error';error.className='nhsFieldError';field.insertAdjacentElement('afterend',error);}
      error.textContent=field.validationMessage;
      const ids=new Set((field.getAttribute('aria-describedby')||'').split(' ').filter(Boolean));ids.add(error.id);
      field.setAttribute('aria-describedby',Array.from(ids).join(' '));
    },true);
    document.addEventListener('input',event=>{
      const field=event.target;
      if(field.getAttribute('aria-invalid')==='true'&&field.validity?.valid){field.removeAttribute('aria-invalid');const error=document.getElementById(field.id+'Error');if(error)error.textContent='';}
    });
    // Observe class/style changes for existing modal APIs; ignore our own ARIA writes.
    new MutationObserver(()=>{if(!scheduled){scheduled=true;requestAnimationFrame(enhance);}}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','style']});
    enhance();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();

</script>


<script id="nhs-final-nav-polish">
(function(){
  function keepActiveNavVisible(){
    document.querySelectorAll('.nav').forEach(function(nav){
      var active=nav.querySelector('.active');
      if(!active)return;
      try{active.scrollIntoView({block:'nearest',inline:'nearest',behavior:'auto'});}catch(e){}
    });
  }
  document.addEventListener('click',function(event){
    if(event.target.closest('.navBtn,.nav button')){
      window.setTimeout(keepActiveNavVisible,0);
    }
  });
  window.addEventListener('resize',keepActiveNavVisible,{passive:true});
  document.addEventListener('DOMContentLoaded',keepActiveNavVisible);
})();
</script>
