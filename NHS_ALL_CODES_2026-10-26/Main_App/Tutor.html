<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta charset="UTF-8">
  <meta name="nhs-environment" content="<?= nhsrg_publicEnvironmentInfo_().environment ?>">
  <meta name="nhs-release-build" content="<?= nhsrg_publicEnvironmentInfo_().build ?>">
  <title>Tesoro NHS Tutor Desk</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%0A%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230B1F3A%22%2F%3E%0A%3Ctext%20x%3D%2232%22%20y%3D%2242%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%2CHelvetica%2Csans-serif%22%20font-size%3D%2234%22%20font-weight%3D%22700%22%20fill%3D%22%23FFFFFF%22%3EU%3C%2Ftext%3E%0A%3C%2Fsvg%3E">
  <meta name="application-name" content="Tesoro NHS Tutor Desk">
  <base target="_top">
  <meta name="theme-color" content="#0B2A47">
  <style>
:root{
  --ui-scale-font:11.5px;
}
body{font-size:var(--ui-scale-font)!important;}
button,input,select,textarea{font-size:inherit;}

:root{
  --navy:#123a5a;
  --navy-2:#0d2f4a;
  --navy-3:#0a253a;
  --blue:#2f6fa8;
  --blue-2:#4d8ec5;
  --blue-soft:#eef6fc;
  --blue-pale:#f6fbff;
  --ink:#17212b;
  --ink-2:#263746;
  --muted:#687887;
  --muted-2:#8c99a5;
  --line:#dde6ed;
  --line-2:#edf2f5;
  --bg:#f4f7fa;
  --surface:#ffffff;
  --surface-2:#fbfdfe;
  --green:#27764f;
  --green-soft:#edf8f2;
  --amber:#9b651d;
  --amber-soft:#fff7e8;
  --red:#a53a32;
  --red-soft:#fff2f0;
  --shadow-sm:0 4px 14px rgba(24,48,68,.06);
  --shadow:0 12px 30px rgba(24,48,68,.08);
  --shadow-lg:0 22px 60px rgba(15,42,62,.14);
  --radius:14px;
  --radius-sm:10px;
  --ease:cubic-bezier(.2,.7,.2,1);
}

*{box-sizing:border-box}

html{
  background:var(--bg);
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 10% -10%, rgba(78,142,197,.08), transparent 32%),
    linear-gradient(180deg,#f8fbfd 0,#f4f7fa 220px,#f4f7fa 100%);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid rgba(47,111,168,.18);
  outline-offset:2px;
}

/* =========================
   TOP BAR / NAV
   ========================= */

.topbar{
  position:sticky;
  top:0;
  z-index:40;
  min-height:76px;
  display:flex;
  align-items:center;
  gap:18px;
  padding:11px 22px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(218,228,236,.92);
  box-shadow:0 2px 12px rgba(27,52,71,.035);
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:200px;
  flex:0 0 auto;
}

.mark{
  width:42px;
  height:42px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:
    linear-gradient(145deg,var(--navy),var(--navy-2));
  color:white;
  font-weight:900;
  font-size:12px;
  letter-spacing:.7px;
  box-shadow:0 7px 17px rgba(18,58,90,.2);
}

.brand strong{
  display:block;
  font-size:13px;
  letter-spacing:-.1px;
}

.brand span{
  display:block;
  margin-top:2px;
  font-size:12px;
  color:var(--muted);
}

.nav{
  display:flex;
  align-items:center;
  gap:4px;
  flex:1;
  min-width:0;
  overflow:auto;
  padding:3px 0;
  scrollbar-width:none;
}

.nav::-webkit-scrollbar{display:none}

.navBtn{
  position:relative;
  border:0;
  background:transparent;
  color:#617383;
  border-radius:9px;
  padding:10px 11px;
  font-size:12px;
  font-weight:750;
  white-space:nowrap;
  transition:
    background .15s var(--ease),
    color .15s var(--ease),
    transform .15s var(--ease);
}

.navBtn:hover{
  background:#f1f6fa;
  color:var(--navy);
}

.navBtn.active{
  background:linear-gradient(180deg,#edf6fc,#e8f2fa);
  color:var(--navy);
  box-shadow:inset 0 0 0 1px #dceaf5;
}

.navBtn.active::after{
  content:"";
  position:absolute;
  left:11px;
  right:11px;
  bottom:3px;
  height:2px;
  border-radius:2px;
  background:var(--blue);
}

.notificationNav{position:relative}

.notificationBadge{
  position:absolute;
  top:0;
  right:-1px;
  min-width:16px;
  height:16px;
  padding:0 4px;
  border-radius:9px;
  background:var(--red);
  color:#fff;
  display:grid;
  place-items:center;
  font-size:12px;
  font-weight:900;
  box-shadow:0 2px 6px rgba(165,58,50,.25);
}

.notificationBadge.hidden{display:none}

.identity{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:190px;
  justify-content:flex-end;
}

.identityText{
  text-align:right;
  line-height:1.2;
  min-width:0;
}

.identityText strong{
  display:block;
  font-size:12px;
  color:var(--ink-2);
}

.identityText span,
.identityText small{
  display:block;
  margin-top:2px;
  font-size:12px;
  color:var(--muted-2);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  max-width:150px;
}

.refreshBtn{
  width:32px;
  height:32px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--surface);
  display:grid;
  place-items:center;
  color:#60758a;
  font-size:17px;
  transition:.16s var(--ease);
  box-shadow:var(--shadow-sm);
}

.refreshBtn:hover{
  background:var(--blue-pale);
  color:var(--blue);
  transform:translateY(-1px);
}

.refreshBtn.spinning{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:
    linear-gradient(145deg,var(--navy),var(--blue));
  color:#fff;
  font-size:12px;
  font-weight:850;
  box-shadow:0 5px 14px rgba(18,58,90,.18);
}

/* =========================
   LAYOUT
   ========================= */

.shell{
  max-width:1180px;
  margin:0 auto;
  padding:30px 24px 64px;
}

.view{display:none}
.view.active{
  display:block;
  animation:fade .2s ease;
}
@keyframes fade{
  from{opacity:.35;transform:translateY(3px)}
  to{opacity:1;transform:none}
}

.pageHead{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:20px;
}

.pageHead h1{
  margin:0;
  font-size:24px;
  line-height:1.1;
  letter-spacing:-.65px;
  color:var(--ink);
}

.pageHead p{
  margin:6px 0 0;
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
  max-width:640px;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--blue);
  font-weight:850;
  margin-bottom:6px;
}

.eyebrow::before{
  content:"";
  width:15px;
  height:2px;
  border-radius:2px;
  background:var(--blue);
}

/* =========================
   CARDS / GRIDS
   ========================= */

.grid{display:grid;gap:14px}
.grid.kpis{
  grid-template-columns:repeat(4,minmax(0,1fr));
  margin-bottom:17px;
}
.grid.two{grid-template-columns:1.3fr .7fr}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}

.card{
  background:linear-gradient(180deg,#fff,#fdfefe);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:17px;
}

.card h2{
  margin:0 0 12px;
  font-size:12px;
  letter-spacing:-.15px;
}

.card h3{
  margin:0;
  font-size:12px;
}

.cardSub{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}

.kpi{
  position:relative;
  overflow:hidden;
  padding:16px 17px;
}

.kpi::after{
  content:"";
  position:absolute;
  right:-24px;
  top:-34px;
  width:90px;
  height:90px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(47,111,168,.08),transparent 70%);
}

.kpiLabel{
  position:relative;
  z-index:1;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.75px;
  color:#83919d;
  font-weight:850;
}

.kpiValue{
  position:relative;
  z-index:1;
  font-size:25px;
  line-height:1;
  font-weight:850;
  margin-top:7px;
  color:var(--navy);
  letter-spacing:-.7px;
}

.kpiMeta{
  position:relative;
  z-index:1;
  font-size:12px;
  color:var(--muted);
  margin-top:5px;
}

/* =========================
   FEATURE / SESSION CARDS
   ========================= */

.heroSession{
  position:relative;
  overflow:hidden;
  padding:20px;
  border:1px solid #cadeed;
  background:
    radial-gradient(circle at 100% 0,rgba(77,142,197,.12),transparent 38%),
    linear-gradient(135deg,#fafdff,#eef7fd);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.heroSession::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:4px;
  height:100%;
  background:linear-gradient(var(--blue),var(--navy));
}

.heroSession .date{
  font-size:12px;
  color:var(--blue);
  font-weight:850;
  text-transform:uppercase;
  letter-spacing:.7px;
}

.heroSession h2{
  font-size:20px;
  letter-spacing:-.4px;
  margin:7px 0 4px;
  color:var(--navy-2);
}

.heroSession .meta{
  font-size:12px;
  color:#526575;
  line-height:1.7;
}

.heroSession .topic{
  margin-top:12px;
  padding:11px 12px;
  border-radius:10px;
  background:rgba(255,255,255,.9);
  border:1px solid #dbe8f1;
  font-size:12px;
  color:#4d5f6d;
  box-shadow:0 3px 10px rgba(24,48,68,.03);
}

.actionCard{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:13px 14px;
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--surface);
  transition:.16s var(--ease);
}

.actionCard:hover{
  border-color:#cfdde8;
  box-shadow:var(--shadow-sm);
  transform:translateY(-1px);
}

.actionCard + .actionCard{margin-top:9px}

.actionCard strong{
  display:block;
  font-size:12px;
  color:var(--ink-2);
}

.actionCard span{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
  line-height:1.45;
}

/* =========================
   ASSIGNMENTS / LISTS
   ========================= */

.assignment{
  display:grid;
  grid-template-columns:1fr auto;
  gap:18px;
  align-items:center;
  padding:14px 15px;
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--surface);
  transition:.16s var(--ease);
}

.assignment:hover{
  border-color:#cddce8;
  box-shadow:0 8px 20px rgba(24,48,68,.06);
  transform:translateY(-1px);
}

.assignment + .assignment{margin-top:9px}

.assignmentTitle{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  font-size:12px;
  font-weight:850;
  color:var(--ink-2);
}

.assignmentMeta{
  font-size:12px;
  color:var(--muted);
  margin-top:5px;
  line-height:1.7;
}

.assignmentActions{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

/* =========================
   BADGES
   ========================= */

.badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:4px 7px;
  border-radius:999px;
  background:#eef2f5;
  color:#4d5f6e;
  font-size:12px;
  font-weight:850;
  line-height:1;
  border:1px solid transparent;
}

.badge.green{
  background:var(--green-soft);
  color:var(--green);
  border-color:#d9eee2;
}
.badge.amber{
  background:var(--amber-soft);
  color:var(--amber);
  border-color:#f1e2c5;
}
.badge.red{
  background:var(--red-soft);
  color:var(--red);
  border-color:#f0d5d1;
}
.badge.blue{
  background:var(--blue-soft);
  color:var(--blue);
  border-color:#d8e8f5;
}

/* =========================
   BUTTONS
   ========================= */

.btn{
  border:1px solid #ccd9e3;
  background:var(--surface);
  color:#355069;
  border-radius:9px;
  padding:8px 11px;
  font-size:12px;
  font-weight:850;
  transition:.15s var(--ease);
  box-shadow:0 1px 2px rgba(24,48,68,.02);
}

.btn:hover{
  transform:translateY(-1px);
  box-shadow:0 5px 13px rgba(33,58,79,.08);
}

.btn.primary{
  background:linear-gradient(180deg,var(--navy),var(--navy-2));
  border-color:var(--navy);
  color:#fff;
}

.btn.success{
  background:linear-gradient(180deg,#2f8259,#246d4b);
  border-color:#246d4b;
  color:#fff;
}

.btn.danger{
  background:#fff;
  border-color:#e2bbb7;
  color:var(--red);
}

.btn.soft{
  background:var(--blue-soft);
  border-color:#d2e4f2;
  color:var(--blue);
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
  transform:none;
  box-shadow:none;
}

/* =========================
   EMPTY STATES
   ========================= */

.empty{
  padding:34px 24px;
  text-align:center;
  border:1px dashed #c8d5df;
  border-radius:12px;
  color:#7b8995;
  background:
    linear-gradient(180deg,#fcfdfe,#f8fbfc);
}

.empty strong{
  display:block;
  color:#526675;
  font-size:12px;
  margin-bottom:4px;
}

.empty span{
  font-size:12px;
  line-height:1.5;
}

/* =========================
   FORMS
   ========================= */

.field{
  display:block;
  margin-bottom:13px;
}

.field>span{
  display:block;
  font-size:12px;
  font-weight:850;
  color:#526576;
  margin-bottom:6px;
  text-transform:uppercase;
  letter-spacing:.5px;
}

input,select,textarea{
  width:100%;
  border:1px solid #cad7e1;
  border-radius:9px;
  background:#fff;
  color:var(--ink);
  padding:10px 11px;
  font-size:12px;
  outline:none;
  transition:.15s var(--ease);
}

input:hover,select:hover,textarea:hover{
  border-color:#b9cad7;
}

input:focus,select:focus,textarea:focus{
  border-color:#8cb6d7;
  box-shadow:0 0 0 3px rgba(47,111,168,.08);
}

textarea{
  resize:vertical;
  min-height:88px;
  line-height:1.45;
}

.checkGrid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;
}

.checkItem{
  display:flex;
  align-items:center;
  gap:7px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:9px;
  font-size:12px;
  background:var(--surface);
  transition:.14s var(--ease);
}

.checkItem:hover{
  border-color:#c8dae7;
  background:var(--blue-pale);
}

.checkItem input{
  width:auto;
  accent-color:var(--blue);
}

/* =========================
   TABLES
   ========================= */

.tableWrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:11px;
  background:#fff;
  box-shadow:var(--shadow-sm);
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th,td{
  padding:10px 11px;
  text-align:left;
  border-bottom:1px solid var(--line-2);
  font-size:12px;
}

th{
  position:sticky;
  top:0;
  z-index:1;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.55px;
  color:#748492;
  background:#f7fafc;
}

tbody tr:hover{background:#fbfdfe}
tr:last-child td{border-bottom:0}

/* =========================
   NOTIFICATIONS
   ========================= */

.notification{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  align-items:start;
  padding:13px 14px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#fff;
  transition:.15s var(--ease);
}

.notification + .notification{margin-top:8px}

.notification:hover{
  border-color:#cedde8;
  box-shadow:var(--shadow-sm);
}

.notification.unread{
  border-color:#a9c9e4;
  background:linear-gradient(180deg,#f9fcff,#f5faff);
  box-shadow:inset 3px 0 0 var(--blue);
}

.notificationTitle{
  font-size:12px;
  font-weight:850;
  color:var(--ink-2);
}

.notificationMeta{
  font-size:12px;
  color:#8a98a5;
  margin-top:3px;
}

.notificationMessage{
  font-size:12px;
  color:#5b6d7c;
  margin-top:6px;
  line-height:1.5;
}

/* =========================
   MODALS
   ========================= */

.modalBackdrop{
  position:fixed;
  inset:0;
  background:rgba(10,29,44,.48);
  backdrop-filter:blur(3px);
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modalBackdrop.open{display:flex}

.modal{
  width:min(680px,96vw);
  max-height:88vh;
  overflow:auto;
  background:#fff;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.5);
  box-shadow:var(--shadow-lg);
  padding:21px;
}

.modalHead{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  margin-bottom:15px;
}

.modalHead h2{
  margin:0;
  font-size:17px;
  letter-spacing:-.3px;
}

.modalHead p{
  margin:4px 0 0;
  font-size:12px;
  color:var(--muted);
}

.closeBtn{
  border:1px solid var(--line);
  background:#f3f6f8;
  width:31px;
  height:31px;
  border-radius:9px;
  color:#596b79;
  font-size:15px;
}

.closeBtn:hover{
  background:#eaf0f4;
}

.infoGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
  margin:12px 0;
}

.info{
  padding:11px;
  border-radius:9px;
  background:#f7fafc;
  border:1px solid #e4ebf0;
}

.info label{
  display:block;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.55px;
  color:#8795a0;
  font-weight:850;
}

.info strong{
  display:block;
  font-size:12px;
  margin-top:4px;
  color:var(--ink-2);
}

.inlinePanel{
  margin-top:12px;
  padding:12px;
  border-radius:10px;
  background:#f8fbfc;
  border:1px solid var(--line);
}

.actionRow{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

/* =========================
   PROGRESS / TOAST / LOADING
   ========================= */

.progress{
  height:8px;
  border-radius:999px;
  background:#e8eef2;
  overflow:hidden;
  margin-top:9px;
}

.progress>span{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--blue),var(--navy));
  border-radius:inherit;
  transition:width .25s var(--ease);
}

.toast{
  position:fixed;
  right:22px;
  bottom:22px;
  z-index:200;
  min-width:240px;
  max-width:390px;
  padding:12px 14px;
  border-radius:11px;
  background:linear-gradient(180deg,#173b58,#11344f);
  color:#fff;
  font-size:12px;
  box-shadow:0 16px 38px rgba(18,42,61,.23);
  opacity:0;
  transform:translateY(9px);
  pointer-events:none;
  transition:.2s var(--ease);
}

.toast.show{
  opacity:1;

const NHS_BOOT_ENV=String((document.querySelector('meta[name="nhs-environment"]')||{}).content||'PRODUCTION').trim().toUpperCase();
const NHS_BOOT_RELEASE_BUILD=String((document.querySelector('meta[name="nhs-release-build"]')||{}).content||'V47.3').trim();

document.addEventListener('DOMContentLoaded',()=>nhsrgApplyEnvironmentBanner_({environment:NHS_BOOT_ENV,build:NHS_BOOT_RELEASE_BUILD}),{once:true});

function nhsrgApplyEnvironmentBanner_(info){
  const banner=document.getElementById('nhsEnvBanner');
  if(!banner)return;
  const env=String(info&&info.environment||'PRODUCTION').toUpperCase();
  if(env!=='STAGING'){
    banner.classList.remove('is-visible');
    banner.textContent='';
    return;
  }
  const build=String(info&&info.build||info&&info.applicationBuild||'').trim();
  banner.innerHTML='<strong>STAGING ENVIRONMENT</strong> — TEST DATA ONLY'+(build?' · '+build:'');
  banner.classList.add('is-visible');
}


const NHS_PROCESS_PRESETS = {
  loading:{

function nhsSetProcessUI_(overlay, presetName, overrides={}){
  if(!overlay)return;

  const preset={
    ...(NHS_PROCESS_PRESETS[presetName]||NHS_PROCESS_PRESETS.loading),
    ...(overrides||{})
  };

  overlay.dataset.processMode=preset.mode||presetName||"loading";

  const icon=overlay.querySelector("[data-process-icon]");
  const eyebrow=overlay.querySelector("[data-process-eyebrow]");
  const title=overlay.querySelector("[data-process-title]");
  const text=overlay.querySelector("[data-process-text]");

  if(icon)icon.textContent=preset.icon||"↻";
  if(eyebrow)eyebrow.textContent=preset.eyebrow||"Working";
  if(title)title.textContent=preset.title||"Working";
  if(text)text.textContent=preset.text||"Please wait while NHS Tutoring finishes this action.";
}

function nhsShowProcess_(presetName="loading", overrides={}, overlayId="loadingOverlay"){
  const overlay=document.getElementById(overlayId);
  if(!overlay)return;
  nhsSetProcessUI_(overlay,presetName,overrides);
  overlay.classList.remove("hidden");
  overlay.setAttribute("aria-hidden","false");
}

function nhsHideProcess_(overlayId="loadingOverlay"){
  const overlay=document.getElementById(overlayId);
  if(!overlay)return;
  overlay.classList.add("hidden");
  overlay.setAttribute("aria-hidden","true");
}



const NHS_CLIENT_CACHE_TTL = 120000;
const NHS_BACKGROUND_REFRESH_MS = 120000;

function nhsNow_(){ return Date.now(); }

function nhsCacheGet_(key){
  try{
    const raw=sessionStorage.getItem(key);
    if(!raw)return null;
    const parsed=JSON.parse(raw);
    if(!parsed || !parsed.savedAt)return null;
    if(nhsNow_()-parsed.savedAt>NHS_CLIENT_CACHE_TTL)return null;
    return parsed.value;
  }catch(e){
    return null;
  }
}

function nhsCacheSet_(key,value){
  try{
    sessionStorage.setItem(
      key,
      JSON.stringify({savedAt:nhsNow_(),value})
    );
  }catch(e){}
}

function nhsIdle_(fn){
  if('requestIdleCallback' in window){
    requestIdleCallback(fn,{timeout:1000});
  }else{
    setTimeout(fn,0);
  }
}

let V36_TUTOR_REQUEST_SYNC_IN_FLIGHT=false;
let V36_TUTOR_REQUEST_SYNC_QUEUED=false;
let TUTOR_BOOT_STARTED=false;
let TUTOR_BOOT_WATCHDOG=null;


function setLoading(on, presetName="loading", overrides={}){
  if(on){
    nhsShowProcess_(presetName,overrides,'loadingOverlay');
  }else{
    nhsHideProcess_('loadingOverlay');
  }
}


function setRefreshState(on){
  const btn=document.getElementById('refreshBtn');
  if(!btn)return;
  btn.classList.toggle('spinning',!!on);
  btn.disabled=!!on;
}


function showTutorBootError_(error){
  const message=cleanTutorAccessError(
    error && error.message ? error.message : String(error || "Unknown startup error")
  );

  setLoading(false);
  setRefreshState(false);

  const shell=document.querySelector('.shell');
  if(shell){
    let box=document.getElementById('tutorBootError');
    if(!box){
      box=document.createElement('div');
      box.id='tutorBootError';
      box.className='inlinePanel';
      box.style.cssText='margin:0 0 16px;border-color:#efc4c0;background:#fff5f3;color:#8f2e29';
      shell.insertBefore(box,shell.firstChild);
    }
    box.innerHTML=`<strong>Tutor Portal could not finish loading.</strong><div style="margin-top:6px">${esc(message)}</div><div style="margin-top:10px"><button class="btn" onclick="manualRefresh()">Retry</button></div>`;
  }else{
    alert('Tutor Portal startup error: '+message);
  }
}

let TUTOR_REFRESH_IN_FLIGHT=false;
let TUTOR_REFRESH_QUEUED_FORCE=false;

function loadPortal(force=false,{silent=false}={}){
  if(TUTOR_REFRESH_IN_FLIGHT){
    TUTOR_REFRESH_QUEUED_FORCE =
      TUTOR_REFRESH_QUEUED_FORCE || !!force;
    return;
  }

  TUTOR_REFRESH_IN_FLIGHT=true;

  if(!HAS_DATA)setLoading(true);

  if(!silent){
    setRefreshState(true);
  }

  google.script.run
    .withSuccessHandler(data=>{
      clearTutorBootWatchdog_();
      try {
      const previousAuthoritativeRequests=
        V42_REQUEST_TRUTH_READY
          ? DATA.requests
          : null;

      const serverCourseCatalogVersion=
        String(
          data?.courseCatalogVersion||''
        );

      const catalogVersionMismatch=
        !!(
          TUTOR_COURSE_CATALOG.length &&
          serverCourseCatalogVersion &&
          TUTOR_COURSE_CATALOG_VERSION &&
          serverCourseCatalogVersion!==
            TUTOR_COURSE_CATALOG_VERSION
        );

      DATA=data;
      nhsrgApplyEnvironmentBanner_(DATA&&DATA.environment);

      // Preserve an already-loaded catalog only when it matches the current
      // server registry. A stale local-cache catalog must be refreshed before
      // it can become authoritative for another profile save.
      if(
        TUTOR_COURSE_CATALOG.length &&
        !catalogVersionMismatch
      ){
        DATA.courseCatalog=
          TUTOR_COURSE_CATALOG;
        DATA.courseCatalogVersion=
          TUTOR_COURSE_CATALOG_VERSION;
      }

      if(previousAuthoritativeRequests){
        DATA.requests=previousAuthoritativeRequests;
      }else if(
        data &&
        data.requestTruth===true &&
        Array.isArray(data.requests)
      ){
        DATA.requests=dedupeTutorRequestsV37_(data.requests);
        V37_TUTOR_REQUEST_AUTHORITY_READY=true;
        V42_REQUEST_TRUTH_READY=true;
        V42_REQUEST_SYNC_FAILED=false;
      }else{
        DATA.requests=[];
      }

      rebuildLocal();

      HAS_DATA=true;
      TUTOR_AUTHORIZED=true;
      LAST_SYNC=Date.now();
      V25_LAST_FULL_SYNC=LAST_SYNC;

      hydrateIdentity();
      renderAll();
      renderTutorBootstrapWarnings_();
      if(DATA.requestTruth !== false){
        saveLocalCache();
      }
      loadTutorCourseCatalog_({
        force:catalogVersionMismatch
      });
      updateSyncLabel();

      setLoading(false);
      v41StartTutorSyncEngine_();

      if(!silent){
        setRefreshState(false);
      }

      scheduleRefresh();
      TUTOR_REFRESH_IN_FLIGHT=false;

      if(TUTOR_REFRESH_QUEUED_FORCE){
        TUTOR_REFRESH_QUEUED_FORCE=false;
        loadPortal(true,{silent:true});
      }
      } catch (renderError) {
        console.error('[Tutor V46.4.2 bootstrap/render]',renderError);
        TUTOR_REFRESH_IN_FLIGHT=false;
        showTutorBootError_(renderError);
      }
    })
    .withFailureHandler(error=>{
      clearTutorBootWatchdog_();
      setLoading(false);

      if(!silent){
        setRefreshState(false);
      }

      const message=error.message||String(error);

      if(
        String(message).includes("ACCESS_DENIED") ||
        String(message).includes("not verified")
      ){
        TUTOR_REFRESH_IN_FLIGHT=false;
        showTutorAccessGate(message);
        return;
      }

      if(!silent||!HAS_DATA){
        toast(cleanTutorAccessError(message),true);
      }

      if(!HAS_DATA){
        showTutorBootError_(error);
      }

      updateSyncLabel(true);
      scheduleRefresh();
      TUTOR_REFRESH_IN_FLIGHT=false;

      if(TUTOR_REFRESH_QUEUED_FORCE){
        TUTOR_REFRESH_QUEUED_FORCE=false;
        loadPortal(true,{silent:true});
      }
    })
    .tutor_getPortalData(!!force);
}

function renderTutorBootstrapWarnings_(){
  const warnings=Array.isArray(DATA.bootstrapWarnings)
    ? DATA.bootstrapWarnings.filter(Boolean)
    : [];
  const existing=document.getElementById('tutorBootstrapWarnings');
  if(!warnings.length){
    if(existing)existing.remove();
    return;
  }

  const shell=document.querySelector('.shell');
  if(!shell)return;
  const box=existing||document.createElement('div');
  box.id='tutorBootstrapWarnings';
  box.className='inlinePanel';
  box.style.cssText='margin:0 0 14px;border-color:#ecd7b3;background:#fffaf1;color:#7a551e';
  box.innerHTML='<strong>Tutor Portal opened in recovery mode.</strong><div style="margin-top:5px">'+warnings.map(esc).join('<br>')+'</div>';
  if(!existing)shell.insertBefore(box,shell.firstChild);
}

function requestTutorAccess(){
  const name=
    document.getElementById('tutorAccessName')?.value.trim()||'';

  const reason=
    document.getElementById('tutorAccessReason')?.value.trim()||'';

  if(!name){
    toast('Enter your full name.',true);
    return;
  }

  toast('Submitting tutor verification request…');

  google.script.run
    .withSuccessHandler(result=>{
      toast(result.message||'Request submitted.');
    })
    .withFailureHandler(error=>{
      toast(
        cleanTutorAccessError(
          error.message||String(error)
        ),
        true
      );
    })
    .nhsa_requestAccess(
      'TUTOR',
      name,
      reason
    );
}


function cleanTutorAccessError(message){
  return String(message||'')
    .replace(/^Exception:\\s*/,'')
    .replace(/^ACCESS_DENIED\\|[^|]*\\|/,'')
    .replace(/^LOGIN_REQUIRED\\|/,'');
}


function loadLocalCache(){
  try{
    localStorage.removeItem(LOCAL_CACHE_KEY);
    sessionStorage.removeItem(LOCAL_CACHE_KEY);
  }catch(e){}
  return false;
}


function loadFreshLocalCache(maxAgeMs){
  try{
    localStorage.removeItem(LOCAL_CACHE_KEY);
    sessionStorage.removeItem(LOCAL_CACHE_KEY);
  }catch(e){}
  return false;
}


function saveLocalCache(){
  try{
    localStorage.removeItem(LOCAL_CACHE_KEY);
    sessionStorage.removeItem(LOCAL_CACHE_KEY);
  }catch(e){}
}


function scheduleRefresh(){
  clearTimeout(REFRESH_TIMER);

  REFRESH_TIMER=setTimeout(()=>{
    if(
      document.visibilityState==='visible' &&
      ACTIVE_SERVER_OPS===0
    ){
      loadPortal(false,{silent:true});
    }else{
      scheduleRefresh();
    }
  },AUTO_REFRESH_MS);
}


function manualRefresh(){
  loadPortal(true,{silent:false});
}


function updateSyncLabel(failed=false){
  const el=document.getElementById('syncLabel');
  if(!el)return;

  if(failed){
    el.textContent=HAS_DATA?'Live check delayed · retrying':'Connecting…';
    return;
  }

  if(!LAST_SYNC){
    el.textContent=HAS_DATA?'Refreshing…':'Connecting…';
    return;
  }

  const sec=Math.max(
    0,
    Math.floor((Date.now()-LAST_SYNC)/1000)
  );

  if(sec<10)el.textContent='Just synced';
  else if(sec<60)el.textContent=`Synced ${sec}s ago`;
  else el.textContent=`Synced ${Math.floor(sec/60)}m ago`;
}


function hydrateIdentity(){
  const identity=DATA.identity||{};
  const name=identity.displayName||identity.preferredName||'Tutor';

  document.getElementById('tutorIdentityName').textContent=name;
  document.getElementById('tutorIdentityEmail').textContent=identity.email||'';
  document.getElementById('avatar').textContent=
    (identity.preferredName||identity.fullName||'T')
      .trim()
      .slice(0,1)
      .toUpperCase();
}


function showView(view){
  CURRENT_VIEW=view;

  document.querySelectorAll('.view')
    .forEach(el=>el.classList.remove('active'));

  document.querySelectorAll('.navBtn')
    .forEach(el=>el.classList.toggle(
      'active',
      el.dataset.view===view
    ));

  const section=document.getElementById('view-'+view);
  if(section)section.classList.add('active');
}


function renderAll(){
  rebuildLocal();

  // V46.4.2: background synchronization must never destroy an unsaved
  // strongest-course edit. Once the Profile DOM exists and the picker is
  // dirty, operational surfaces may refresh but the Profile DOM is preserved
  // in-place until Save resolves. This also preserves keyboard focus/chips.
  const preserveProfileDraft=!!(
    TUTOR_STRONGEST_DRAFT_DIRTY &&
    document.getElementById('profileStrongest')
  );

  const surfaces=[
    ['home',renderHome],
    ['assignments',renderAssignments],
    ['upcoming',renderUpcoming],
    ['report',renderReport],
    ['hours',renderHours],
    ['availability',renderAvailability],
    ['profile',()=>{
      if(preserveProfileDraft){
        hydrateTutorStrongestCoursePicker_();
        return;
      }
      renderProfile();
    }],
    ['notifications',renderNotifications]
  ];

  surfaces.forEach(([name,render])=>{
    try{
      render();
    }catch(error){
      console.error('[Tutor V46.4.2 render]',name,error);
    }
  });
}


function weeklyAvailabilityData_(){
  return DATA.weeklyAvailability||{dates:[],weekStart:'',weekLabel:'',confirmed:false,notConfirmedCount:4};
}

function ensureWeeklyAvailabilityDraft_(){
  const weekly=weeklyAvailabilityData_();
  if(
    WEEKLY_AVAIL_DRAFT_DIRTY && WEEKLY_AVAIL_DRAFT &&
    WEEKLY_AVAIL_DRAFT.weekStart===weekly.weekStart
  ) return WEEKLY_AVAIL_DRAFT;

  const statuses={};
  (weekly.dates||[]).forEach(d=>{
    statuses[d.date]=d.hardBlocked?'Unavailable':(d.confirmed?d.status:(d.defaultStatus||'Unavailable'));
  });
  WEEKLY_AVAIL_DRAFT={weekStart:weekly.weekStart,statuses};
  WEEKLY_AVAIL_DRAFT_DIRTY=false;
  return WEEKLY_AVAIL_DRAFT;
}

function setWeeklyDayStatus(date,status){
  const weekly=weeklyAvailabilityData_();
  const row=(weekly.dates||[]).find(d=>d.date===date);
  if(row?.hardBlocked){toast('This date is blocked by your Temporary Unavailable Dates.',true);return;}
  const draft=ensureWeeklyAvailabilityDraft_();
  draft.statuses[date]=status;
  WEEKLY_AVAIL_DRAFT_DIRTY=true;
  renderAll();
}

function weeklyAvailabilityCard_(compact=false){
  const weekly=weeklyAvailabilityData_();
  if(!weekly.weekStart||!(weekly.dates||[]).length)return '';
  const draft=ensureWeeklyAvailabilityDraft_();
  const confirmed=weekly.confirmed&&!WEEKLY_AVAIL_DRAFT_DIRTY;
  return `
    <div class="weeklyAvailCard">
      <div class="weeklyAvailHead">
        <div>
          <div class="eyebrow">Weekly Availability</div>
          <h2>${compact?'Confirm This Week':'Titan Time Availability · '+esc(weekly.weekLabel||'')}</h2>
          <p>${compact?'Keep this week accurate so NHS matches you only when you are actually free.':'Your typical schedule is pre-filled. Change only this week’s exceptions, then confirm.'}</p>
        </div>
        <span class="weeklyStatusPill ${confirmed?'ok':'pending'}">${confirmed?'✓ Confirmed':'Action Required'}</span>
      </div>
      <div class="weeklyDays">
        ${(weekly.dates||[]).map(d=>{
          const value=draft.statuses[d.date]||d.defaultStatus||'Unavailable';
          return `<div class="weeklyDay ${d.hardBlocked?'blocked':''}">
            <div class="weeklyDayDate">${esc(d.day||'')}</div>
            <div class="weeklyDayLabel">${esc(fmtDate(d.date))}</div>
            <div class="weeklyToggle" data-weekly-date="${attr(d.date)}">
              <button type="button" class="${value==='Available'?'active available':''}" ${d.hardBlocked?'disabled':''} onclick="setWeeklyDayStatus('${js(d.date)}','Available')">Available</button>
              <button type="button" class="${value==='Unavailable'?'active unavailable':''}" onclick="setWeeklyDayStatus('${js(d.date)}','Unavailable')">Unavailable</button>
            </div>
            <div class="weeklyMeta">${d.hardBlocked?'Blocked by temporary unavailable dates':d.confirmed?('Confirmed'+(d.source?' · '+esc(d.source):'')):(d.typicalAvailable?'Pre-filled from typical availability':'Not confirmed yet')}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="weeklyActions">
        <button class="btn primary" onclick="saveWeeklyAvailability()">${confirmed?'Update This Week':'Confirm This Week'}</button>
        ${compact?`<button class="btn soft" onclick="showView('availability')">Availability Settings</button>`:''}
        <span class="weeklyHint">Weekly confirmation overrides your typical schedule only for these specific dates.</span>
      </div>
    </div>`;
}

let NHS_WEEKLY_SAVING=false;
function saveWeeklyAvailability(){
  if(NHS_WEEKLY_SAVING)return;
  const weekly=weeklyAvailabilityData_();
  const draft=ensureWeeklyAvailabilityDraft_();
  if(!weekly.weekStart){toast('Weekly availability is not ready yet.',true);return;}
  const statuses=(weekly.dates||[]).map(d=>({date:d.date,status:draft.statuses[d.date]||d.defaultStatus||'Unavailable'}));
  NHS_WEEKLY_SAVING=true;
  ACTIVE_SERVER_OPS++;
  setLoading(true,'saving',{title:'Confirming weekly availability',text:'Saving your Tuesday–Friday Titan Time availability and refreshing matching.'});
  google.script.run
    .withSuccessHandler(result=>{
      NHS_WEEKLY_SAVING=false;setLoading(false);ACTIVE_SERVER_OPS=Math.max(0,ACTIVE_SERVER_OPS-1);
      if(result?.weeklyAvailability)DATA.weeklyAvailability=result.weeklyAvailability;
      WEEKLY_AVAIL_DRAFT=null;WEEKLY_AVAIL_DRAFT_DIRTY=false;
      renderAll();saveLocalCache();toast(result?.message||'Weekly availability confirmed.');quietRefresh(250);
    })
    .withFailureHandler(error=>{
      NHS_WEEKLY_SAVING=false;setLoading(false);ACTIVE_SERVER_OPS=Math.max(0,ACTIVE_SERVER_OPS-1);
      toast(error?.message||String(error),true);
    })
    .tutor_confirmWeeklyAvailability({weekStart:weekly.weekStart,statuses});
}

function tutorDirectoryPreviewInitials_(name){
  const parts=String(name||'')
    .trim()
    .split(/\s+/)
    .filter(Boolean);

  if(!parts.length)return 'NHS';

  return (
    (parts[0]?.[0]||'')+
    (parts.length>1?(parts.at(-1)?.[0]||''):'')
  ).toUpperCase();
}

function tutorQualifiedCoursesFromProfile_(p){
  const raw=[
    p?.englishCourses,
    p?.mathCourses,
    p?.scienceCourses,
    p?.socialScienceCourses,
    p?.languageCourses,
    p?.cteCourses,
    p?.strongestCourse
  ]
    .filter(Boolean)
    .join(',');

  const seen=new Set();

  return raw
    .split(/[\n,;]+/)
    .map(value=>String(value||'').trim())
    .filter(Boolean)
    .filter(value=>{
      const key=value.toLowerCase();
      if(seen.has(key))return false;
      seen.add(key);
      return true;
    });
}

function tutorDateDiffDays_(dateKey){
  const m=String(dateKey||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m)return NaN;
  const target=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]),12,0,0);
  const now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12,0,0);
  return Math.round((target.getTime()-today.getTime())/86400000);
}

function reconfirmationWindowOpen_(r){
  const diff=tutorDateDiffDays_(r?.scheduledDate);
  return Number.isFinite(diff)&&diff>=1&&diff<=Number(DATA.reconfirmDays||7);
}

function needsReconfirmation_(r){
  if(!r||String(r.tutorResponseStatus||'')!=='Accepted')return false;
  if(String(r.tutorReconfirmStatus||'')==='Confirmed')return false;
  return r.schedulingType==='Future Reservation'||String(r.tutorReconfirmStatus||'')==='Required'||String(r.tutorReconfirmStatus||'')==='Not Yet Open';
}

function reconfirmCurrentSession(requestId){
  if(PENDING_REQUESTS.has(requestId))return;
  const r=(DATA.requests||[]).find(x=>x.requestId===requestId);
  if(!r)return;
  const snapshot={...r};
  PENDING_REQUESTS.add(requestId);
  patchRequest(requestId,{tutorReconfirmStatus:'Confirmed',tutorReconfirmAt:new Date().toISOString(),notificationStatus:'Tutor Reconfirmed — Ready to Confirm'});
  toast('Availability reconfirmed.');
  google.script.run
    .withSuccessHandler(result=>{
      PENDING_REQUESTS.delete(requestId);
      if(result?.patch)patchRequest(requestId,result.patch);
      toast(result?.message||'Availability reconfirmed.');
      quietRefresh(120);
    })
    .withFailureHandler(error=>{
      PENDING_REQUESTS.delete(requestId);
      patchRequest(requestId,snapshot);
      toast(error.message||String(error),true);
      quietRefresh(120);
    })
    .tutor_reconfirmSession(requestId);
}

function confirmFiveStarEnrollment(requestId){
  if(PENDING_REQUESTS.has(requestId))return;

function acceptCurrent(){
  if(!CURRENT)return;

  const requestId=CURRENT.requestId;

  if(PENDING_REQUESTS.has(requestId)){
    toast('This assignment is already syncing.');
    return;
  }

  const snapshot={...CURRENT};

  PENDING_REQUESTS.add(requestId);
  ACTIVE_SERVER_OPS++;

  patchRequest(
    requestId,
    {
      tutorResponseStatus:'Accepted',
      tutorResponseAt:new Date().toISOString(),
      declineReason:'',
      notificationStatus:'Tutor Accepted — Ready to Confirm'
    }
  );

  closeModal();
  toast('Assignment accepted.');

  google.script.run
    .withSuccessHandler(result=>{
      PENDING_REQUESTS.delete(requestId);
      ACTIVE_SERVER_OPS=Math.max(0,ACTIVE_SERVER_OPS-1);

      if(result?.patch)patchRequest(requestId,result.patch);
      quietRefresh(900);
    })
    .withFailureHandler(error=>{
      setLoading(false);
      PENDING_REQUESTS.delete(requestId);
      ACTIVE_SERVER_OPS=Math.max(0,ACTIVE_SERVER_OPS-1);

      patchRequest(requestId,snapshot);
      toast(error.message||String(error),true);
      quietRefresh(300);
    })
    .tutor_acceptAssignment(requestId);
}


function toggleDeclineBox(open){
  const el=document.getElementById('declineBox');
  if(el)el.style.display=open?'block':'none';
}


function declineCurrent(){
  if(!CURRENT)return;

  const requestId=CURRENT.requestId;

  if(PENDING_REQUESTS.has(requestId)){
    toast('This assignment is already syncing.');
    return;
  }

  const reason=document.getElementById('declineReason')?.value||'Tutor unavailable';
  const note=(document.getElementById('declineNote')?.value||'').trim();
  const combined=note?`${reason}: ${note}`:reason;
  const snapshot={...CURRENT};

  PENDING_REQUESTS.add(requestId);
  ACTIVE_SERVER_OPS++;

  removeRequest(requestId);
  closeModal();
  toast('Assignment declined. NHS will reassign it.');

  google.script.run
    .withSuccessHandler(()=>{
      PENDING_REQUESTS.delete(requestId);
      ACTIVE_SERVER_OPS=Math.max(0,ACTIVE_SERVER_OPS-1);
      quietRefresh(900);
    })
    .withFailureHandler(error=>{
      PENDING_REQUESTS.delete(requestId);
      ACTIVE_SERVER_OPS=Math.max(0,ACTIVE_SERVER_OPS-1);

      DATA.requests=[
        snapshot,
        ...(DATA.requests||[]).filter(r=>r.requestId!==requestId)
      ];

      rebuildLocal();
      renderAll();
      saveLocalCache();

      toast(error.message||String(error),true);
      quietRefresh(300);
    })
    .tutor_declineAssignment(requestId,combined);
}


function openReport(requestId){
  const r=(DATA.requests||[]).find(x=>x.requestId===requestId);
  if(!r)return;

  CURRENT=r;

  openModal(`
    <div class="modalHead">
      <div>
        <h2>Report Session</h2>
        <p>${esc(r.course||'Tutoring')} · ${esc(r.requestId)}</p>
      </div>
      <button class="closeBtn" onclick="closeModal()">×</button>
    </div>

    <div class="infoGrid">
      ${info('Date',r.scheduledDate?fmtDate(r.scheduledDate):'Today')}
      ${info('Teacher',r.teacherName||'')}
      ${info('Time',r.scheduledTime||DATA.titanTime)}
      ${info('Room',r.location||'TBD')}
    </div>

    <label class="field">
      <span>Session Result</span>
      <select id="reportResult" onchange="updateReportMinutes()">
        <option>Completed</option>
        <option>Student No-Show</option>
        <option>Teacher Cancelled</option>
        <option>Tutor Unable to Attend</option>
        <option>Reschedule Needed</option>
      </select>
    </label>

    <label class="field">
      <span>Minutes Tutored</span>
      <input id="reportMinutes" type="number" min="0" max="120" value="40">
    </label>

    <label class="field">
      <span>Notes</span>
      <textarea id="reportNotes" maxlength="1200" placeholder="Briefly note what you covered, or explain any issue that needs NHS follow-up."></textarea>
    </label>

    <div class="actionRow">
      <button id="submitReportBtn" class="btn primary" onclick="submitReport()">Submit Session Report</button>
      <button class="btn" onclick="closeModal()">Cancel</button>
    </div>
  `);
}


function updateReportMinutes(){
  const result=document.getElementById('reportResult')?.value;
  const input=document.getElementById('reportMinutes');

  if(!input)return;

  if(result==='Completed'){
    input.disabled=false;
    if(Number(input.value||0)===0)input.value='40';
  }else{
    input.value='0';
    input.disabled=true;
  }
}


function submitReport(){
  if(!CURRENT)return;

  const requestId=CURRENT.requestId;

  if(PENDING_REQUESTS.has(requestId)){
    toast('This session report is already syncing.');
    return;
  }

  const result=document.getElementById('reportResult')?.value||'Completed';
  const minutes=Number(document.getElementById('reportMinutes')?.value||0);
  const notes=(document.getElementById('reportNotes')?.value||'').trim();
  const snapshot={...CURRENT};

  PENDING_REQUESTS.add(requestId);
  ACTIVE_SERVER_OPS++;

  setLoading(
    true,
    'submitting',
    {
      title:'Submitting session report',
      text:'Sending the session outcome and service minutes for NHS verification.'
    }
  );

  const nextStatus=
    result==='Completed'
      ? 'Pending Verification'
      : result==='Teacher Cancelled'&&!CURRENT.recurringActive
        ? 'Cancelled'
        : 'Needs Follow-Up';

  patchRequest(
    requestId,
    {status:nextStatus}
  );

  closeModal();

  toast(
    result==='Completed'
      ? 'Session submitted for verification.'
      : 'Session outcome reported.'
  );

  google.script.run
    .withSuccessHandler(resultData=>{
      setLoading(false);
      PENDING_REQUESTS.delete(requestId);
      ACTIVE_SERVER_OPS=Math.max(0,ACTIVE_SERVER_OPS-1);

      if(resultData?.duplicatePrevented){
        toast(resultData.message||'Session already reported.');
      }

      quietRefresh(700);
    })
    .withFailureHandler(error=>{
      PENDING_REQUESTS.delete(requestId);
      ACTIVE_SERVER_OPS=Math.max(0,ACTIVE_SERVER_OPS-1);

      patchRequest(requestId,snapshot);
      toast(error.message||String(error),true);
      quietRefresh(300);
    })
    .tutor_reportSession({
      requestId,
      result,
      minutes,
      notes,
      sessionDate:CURRENT.scheduledDate||''
    });
}


function saveAvailability(){
  const days=[...document.querySelectorAll('input[name="availabilityDay"]:checked')]
    .map(el=>el.value);

  const payload={
    days,
    maxSessions:Number(document.getElementById('maxSessions').value||1),
    temporaryUnavailableDates:document.getElementById('temporaryUnavailable').value||'',
    reminderPreference:document.getElementById('reminderPreference').value
  };

  const snapshot={...(DATA.profile||{})};

  const patch={
    titanAvailability:days.join(', '),
    maxSessions:payload.maxSessions,
    temporaryUnavailableDates:payload.temporaryUnavailableDates,
    reminderPreference:payload.reminderPreference
  };

  // Instant local response.
  Object.assign(DATA.profile,patch);
  renderAll();
  saveLocalCache();
  toast('Availability saved.');

  ACTIVE_SERVER_OPS++;
  setLoading(
    true,
    'saving',
    {
      title:'Saving availability',
      text:'Updating your Titan Time availability, capacity, and reminder preferences.'
    }
  );

  google.script.run
    .withSuccessHandler(result=>{
      setLoading(false);
      ACTIVE_SERVER_OPS=Math.max(0,ACTIVE_SERVER_OPS-1);

      if(result?.patch){
        Object.assign(DATA.profile,result.patch);
        renderAll();
        saveLocalCache();
      }

      quietRefresh(1200);
    })
    .withFailureHandler(error=>{
      setLoading(false);
      ACTIVE_SERVER_OPS=Math.max(0,ACTIVE_SERVER_OPS-1);

      DATA.profile=snapshot;
      renderAll();
      saveLocalCache();

      toast(error.message||String(error),true);
      quietRefresh(350);
    })
    .tutor_updateAvailability(payload);
}


/* ============================================================
   V46 — FAIL-SAFE COURSE CATALOG LOAD
   ============================================================ */
let TUTOR_COURSE_CATALOG_LOADING=false;
let TUTOR_COURSE_CATALOG_LOADED=false;
let TUTOR_COURSE_CATALOG=[];
let TUTOR_COURSE_CATALOG_VERSION='';
let TUTOR_COURSE_ACTIVE_INDEX=-1;

function tutorAdoptCatalog_(courses,version){
  const next=Array.isArray(courses)
    ? courses.filter(course=>course&&course.id&&course.name)
    : [];

  if(!next.length)return false;

  // Keep the catalog outside DATA. DATA is replaced wholesale by normal
  // portal refreshes; picker state must not disappear with that payload.
  TUTOR_COURSE_CATALOG=next;
  TUTOR_COURSE_CATALOG_VERSION=String(version||TUTOR_COURSE_CATALOG_VERSION||'');
  TUTOR_COURSE_CATALOG_LOADED=true;

  // Mirror into DATA only for cache/debug compatibility. It is not the
  // authoritative catalog store anymore.
  DATA.courseCatalog=TUTOR_COURSE_CATALOG;
  DATA.courseCatalogVersion=TUTOR_COURSE_CATALOG_VERSION;
  return true;
}

function tutorRestoreCatalogFromData_(){
  if(TUTOR_COURSE_CATALOG.length)return true;
  const cached=Array.isArray(DATA.courseCatalog)?DATA.courseCatalog:[];
  return tutorAdoptCatalog_(cached,DATA.courseCatalogVersion||'');
}

function loadTutorCourseCatalog_(options={}){
  const force=!!options.force;

  // A loaded flag without actual catalog rows is never considered loaded.
  // This is the V46.4.1 disappearing-chip root-cause guard.
  if(TUTOR_COURSE_CATALOG_LOADED&&!TUTOR_COURSE_CATALOG.length){
    TUTOR_COURSE_CATALOG_LOADED=false;
  }

  if(TUTOR_COURSE_CATALOG_LOADING)return;
  if(TUTOR_COURSE_CATALOG.length&&!force){
    TUTOR_COURSE_CATALOG_LOADED=true;
    DATA.courseCatalog=TUTOR_COURSE_CATALOG;
    DATA.courseCatalogVersion=TUTOR_COURSE_CATALOG_VERSION;
    return;
  }

  // A fresh browser cache can already contain the catalog. Adopt it before
  // making another Apps Script call.
  if(!force&&tutorRestoreCatalogFromData_())return;

  TUTOR_COURSE_CATALOG_LOADING=true;
  google.script.run
    .withSuccessHandler(result=>{
      TUTOR_COURSE_CATALOG_LOADING=false;
      const courses=result&&Array.isArray(result.courses)?result.courses:[];
      if(!tutorAdoptCatalog_(courses,result&&result.version)){
        TUTOR_COURSE_CATALOG_LOADED=!!TUTOR_COURSE_CATALOG.length;
        return;
      }

      if(!TUTOR_STRONGEST_DRAFT_DIRTY){
        TUTOR_STRONGEST_STATE_READY=false;
      }

      hydrateTutorStrongestCoursePicker_();
      saveLocalCache();

      const input=document.getElementById('profileStrongestSearch');
      if(input&&document.activeElement===input&&input.value.trim()){
        renderTutorCourseSuggestions_();
      }
    })
    .withFailureHandler(error=>{
      TUTOR_COURSE_CATALOG_LOADING=false;

      // Never destroy a previously good catalog because a background reload
      // failed. Existing picker chips remain fully resolvable/offline-safe.
      TUTOR_COURSE_CATALOG_LOADED=!!TUTOR_COURSE_CATALOG.length;
      console.warn('Tutor course catalog load failed:',error&&error.message?error.message:error);
    })
    .nhscourse_getCatalog();
}

/* ============================================================
   V46.4.2 — STRONGEST COURSE MULTI-SELECT AUTOCOMPLETE
   Canonical selected IDs are the source of truth. Unsaved draft
   selections survive background portal re-renders until Save resolves.
   ============================================================ */
let TUTOR_STRONGEST_SELECTED_IDS=[];
let TUTOR_STRONGEST_DRAFT_DIRTY=false;
let TUTOR_STRONGEST_STATE_READY=false;
let TUTOR_STRONGEST_EDIT_REVISION=0;
let TUTOR_PROFILE_SAVE_SEQ=0;

function tutorCourseCatalog_(){
  if(TUTOR_COURSE_CATALOG.length){
    return TUTOR_COURSE_CATALOG;
  }

  // Recover from local-cache hydration without coupling the picker to DATA.
  if(tutorRestoreCatalogFromData_()){
    return TUTOR_COURSE_CATALOG;
  }

  if(!TUTOR_COURSE_CATALOG_LOADING){
    loadTutorCourseCatalog_();
  }

  return TUTOR_COURSE_CATALOG;
}

function tutorCourseSearchKey_(value){
  return String(value||'')
    .toLowerCase()
    .replace(/&/g,' and ')
    .replace(/[.']/g,'')
    .replace(/[^a-z0-9]+/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function tutorCourseById_(courseId){
  const id=String(courseId||'').trim();
  if(!id)return null;
  return tutorCourseCatalog_().find(course=>String(course.id||'')===id)||null;
}

function tutorCourseResolveLocal_(value){
  const key=tutorCourseSearchKey_(value);
  if(!key)return null;
  return tutorCourseCatalog_().find(course=>
    [course.id,course.name].concat(course.aliases||[])
      .some(v=>tutorCourseSearchKey_(v)===key)
  )||null;
}

function tutorStrongestIdsFromText_(value){
  const seen=new Set();
  return String(value||'')
    .split(/[\n,;]+/)
    .map(v=>v.trim())
    .filter(Boolean)
    .map(v=>tutorCourseResolveLocal_(v))
    .filter(Boolean)
    .filter(course=>{
      if(seen.has(course.id))return false;
      seen.add(course.id);
      return true;
    })
    .slice(0,3)
    .map(course=>course.id);
}

function tutorStrongestNamesFromIds_(ids){
  const seen=new Set();
  return (Array.isArray(ids)?ids:[])
    .map(id=>tutorCourseById_(id))
    .filter(Boolean)
    .filter(course=>{
      if(seen.has(course.id))return false;
      seen.add(course.id);
      return true;
    })
    .slice(0,3)
    .map(course=>course.name)
    .join(', ');
}

function tutorStrongestEnsureState_(){
  if(TUTOR_STRONGEST_STATE_READY)return;
  const catalog=tutorCourseCatalog_();
  if(!catalog.length)return;

  const hidden=document.getElementById('profileStrongest');
  const source=hidden
    ? String(hidden.value||'')
    : String(DATA.profile?.strongestCourse||'');

  TUTOR_STRONGEST_SELECTED_IDS=tutorStrongestIdsFromText_(source);
  TUTOR_STRONGEST_STATE_READY=true;
}

function tutorStrongestResetFromText_(value){
  if(!tutorCourseCatalog_().length){
    TUTOR_STRONGEST_STATE_READY=false;
    TUTOR_STRONGEST_SELECTED_IDS=[];
    TUTOR_STRONGEST_DRAFT_DIRTY=false;
    return;
  }
  TUTOR_STRONGEST_SELECTED_IDS=tutorStrongestIdsFromText_(value);
  TUTOR_STRONGEST_STATE_READY=true;
  TUTOR_STRONGEST_DRAFT_DIRTY=false;
}

function tutorStrongestIds_(){
  tutorStrongestEnsureState_();
  return TUTOR_STRONGEST_SELECTED_IDS.slice();
}

function tutorStrongestAssertState_(){
  // Defensive self-heal: if IDs exist but the catalog somehow vanished,
  // immediately request it again instead of rendering an empty chip list.
  if(TUTOR_STRONGEST_SELECTED_IDS.length&&!tutorCourseCatalog_().length){
    TUTOR_COURSE_CATALOG_LOADED=false;
    loadTutorCourseCatalog_({force:true});
    return false;
  }
  return true;
}

function syncTutorStrongestHidden_(ids=TUTOR_STRONGEST_SELECTED_IDS){
  const hidden=document.getElementById('profileStrongest');
  if(!hidden)return;
  hidden.value=tutorStrongestNamesFromIds_(ids);
}

function updateTutorStrongestInputState_(){
  const input=document.getElementById('profileStrongestSearch');
  if(!input)return;
  const count=TUTOR_STRONGEST_SELECTED_IDS.length;
  input.disabled=count>=3;
  input.placeholder=count>=3
    ? 'Maximum 3 strongest courses selected'
    : (count ? 'Search another course' : 'Search courses — e.g. calc, APUSH, bio');
  if(count>=3){
    input.value='';
    input.setAttribute('aria-expanded','false');
  }
}

function hydrateTutorStrongestCoursePicker_(){
  const hidden=document.getElementById('profileStrongest');
  if(!hidden)return;

  if(!tutorCourseCatalog_().length){
    // Never erase the existing text while the catalog is still loading.
    loadTutorCourseCatalog_();
    return;
  }

  if(!TUTOR_STRONGEST_DRAFT_DIRTY){
    const source=String(hidden.value||DATA.profile?.strongestCourse||'');
    TUTOR_STRONGEST_SELECTED_IDS=tutorStrongestIdsFromText_(source);
    TUTOR_STRONGEST_STATE_READY=true;
  }else{
    TUTOR_STRONGEST_STATE_READY=true;
  }

  tutorStrongestAssertState_();
  syncTutorStrongestHidden_();
  renderTutorStrongestChips_();
  updateTutorStrongestInputState_();
}

function renderTutorStrongestChips_(ids=TUTOR_STRONGEST_SELECTED_IDS){
  const box=document.getElementById('profileStrongestChips');
  if(!box)return;

  const valid=(Array.isArray(ids)?ids:[])
    .map(id=>tutorCourseById_(id))
    .filter(Boolean);

  box.innerHTML=valid.map(course=>`
    <span class="courseChip">
      <span class="courseChipLabel">${esc(course.name)}</span>
      <button
        type="button"
        class="courseChipRemove"
        data-course-id="${attr(course.id)}"
        aria-label="Remove ${attr(course.name)}"
      >×</button>
    </span>
  `).join('');

  box.querySelectorAll('.courseChipRemove').forEach(button=>{
    button.addEventListener('click',event=>{
      event.preventDefault();
      event.stopPropagation();
      removeTutorStrongestCourse_(button.dataset.courseId||'');
    });
  });
}

function tutorCourseResults_(query,limit=10){
  const q=tutorCourseSearchKey_(query);
  if(!q)return [];
  tutorStrongestEnsureState_();
  const selected=new Set(TUTOR_STRONGEST_SELECTED_IDS);

  return tutorCourseCatalog_()
    .filter(course=>!selected.has(course.id))
    .map(course=>{
      const name=tutorCourseSearchKey_(course.name);
      let rank=99;
      if(name.startsWith(q))rank=0;
      else if(name.includes(q))rank=1;
      else (course.aliases||[]).forEach(alias=>{
        const a=tutorCourseSearchKey_(alias);
        if(a.startsWith(q))rank=Math.min(rank,2);
        else if(a.includes(q))rank=Math.min(rank,3);
      });
      return {course,rank};
    })
    .filter(item=>item.rank<99)
    .sort((a,b)=>a.rank-b.rank||a.course.name.localeCompare(b.course.name))
    .slice(0,limit)
    .map(item=>item.course);
}

function tutorStrongestInputChanged_(){
  TUTOR_COURSE_ACTIVE_INDEX=-1;
  if(!tutorCourseCatalog_().length){
    loadTutorCourseCatalog_();
  }
  renderTutorCourseSuggestions_();
}

function closeTutorCourseSuggestions_(){
  const input=document.getElementById('profileStrongestSearch');
  const box=document.getElementById('profileStrongestSuggestions');
  if(box){box.hidden=true;box.innerHTML='';}
  if(input)input.setAttribute('aria-expanded','false');
  TUTOR_COURSE_ACTIVE_INDEX=-1;
}

function renderTutorCourseSuggestions_(){
  const input=document.getElementById('profileStrongestSearch');
  const box=document.getElementById('profileStrongestSuggestions');
  if(!input||!box)return;

  tutorStrongestEnsureState_();

  if(TUTOR_STRONGEST_SELECTED_IDS.length>=3){
    closeTutorCourseSuggestions_();
    updateTutorStrongestInputState_();
    return;
  }

  const results=tutorCourseResults_(input.value);
  if(!results.length){
    closeTutorCourseSuggestions_();
    return;
  }

  if(TUTOR_COURSE_ACTIVE_INDEX>=results.length){
    TUTOR_COURSE_ACTIVE_INDEX=results.length-1;
  }

  box.innerHTML=results.map((course,index)=>`
    <button
      type="button"
      class="courseSuggestion ${index===TUTOR_COURSE_ACTIVE_INDEX?'active':''}"
      role="option"
      aria-selected="${index===TUTOR_COURSE_ACTIVE_INDEX?'true':'false'}"
      data-course-id="${attr(course.id)}"
    >
      <strong>${esc(course.name)}</strong>
      <small>${esc(course.department||'Tesoro course')}</small>
    </button>
  `).join('');

  box.querySelectorAll('.courseSuggestion').forEach(button=>{
    // mousedown prevents input blur/re-render from racing the selection.
    button.addEventListener('mousedown',event=>event.preventDefault());
    button.addEventListener('click',event=>{
      event.preventDefault();
      addTutorStrongestCourse_(button.dataset.courseId||'');
    });
  });

  box.hidden=false;
  input.setAttribute('aria-expanded','true');
}

function tutorStrongestKeydown_(event){
  if(event.key==='Escape'){
    closeTutorCourseSuggestions_();
    return;
  }

  const results=tutorCourseResults_(event.currentTarget.value);
  if(!results.length)return;

  if(event.key==='ArrowDown'){
    event.preventDefault();
    TUTOR_COURSE_ACTIVE_INDEX=Math.min(results.length-1,TUTOR_COURSE_ACTIVE_INDEX+1);
    renderTutorCourseSuggestions_();
  }else if(event.key==='ArrowUp'){
    event.preventDefault();
    TUTOR_COURSE_ACTIVE_INDEX=TUTOR_COURSE_ACTIVE_INDEX<=0?0:TUTOR_COURSE_ACTIVE_INDEX-1;
    renderTutorCourseSuggestions_();
  }else if(event.key==='Enter'){
    event.preventDefault();
    const index=TUTOR_COURSE_ACTIVE_INDEX>=0?TUTOR_COURSE_ACTIVE_INDEX:0;
    if(results[index])addTutorStrongestCourse_(results[index].id);
  }
}

function addTutorStrongestCourse_(courseId){
  tutorStrongestEnsureState_();
  const course=tutorCourseById_(courseId);
  if(!course)return false;
  if(TUTOR_STRONGEST_SELECTED_IDS.includes(course.id)){
    closeTutorCourseSuggestions_();
    return true;
  }
  if(TUTOR_STRONGEST_SELECTED_IDS.length>=3)return false;

  TUTOR_STRONGEST_SELECTED_IDS=TUTOR_STRONGEST_SELECTED_IDS.concat(course.id).slice(0,3);
  TUTOR_STRONGEST_STATE_READY=true;
  TUTOR_STRONGEST_DRAFT_DIRTY=true;
  TUTOR_STRONGEST_EDIT_REVISION++;

  syncTutorStrongestHidden_();
  renderTutorStrongestChips_();
  updateTutorStrongestInputState_();

  const input=document.getElementById('profileStrongestSearch');
  if(input){
    input.value='';
    if(!input.disabled)input.focus({preventScroll:true});
  }
  closeTutorCourseSuggestions_();
  return true;
}

function removeTutorStrongestCourse_(courseId){
  tutorStrongestEnsureState_();
  const before=TUTOR_STRONGEST_SELECTED_IDS.length;
  TUTOR_STRONGEST_SELECTED_IDS=TUTOR_STRONGEST_SELECTED_IDS.filter(id=>id!==courseId);
  if(TUTOR_STRONGEST_SELECTED_IDS.length===before)return false;

  TUTOR_STRONGEST_STATE_READY=true;
  TUTOR_STRONGEST_DRAFT_DIRTY=true;
  TUTOR_STRONGEST_EDIT_REVISION++;
  syncTutorStrongestHidden_();
  renderTutorStrongestChips_();
  updateTutorStrongestInputState_();
  closeTutorCourseSuggestions_();

  const input=document.getElementById('profileStrongestSearch');
  if(input){
    input.disabled=false;
    input.focus({preventScroll:true});
  }
  return true;
}

function saveProfile(){
  tutorStrongestEnsureState_();

  const strongestTouched=
    TUTOR_STRONGEST_DRAFT_DIRTY===true;

  const selectedIds=
    TUTOR_STRONGEST_SELECTED_IDS
      .slice(0,3);

  if(strongestTouched){
    if(
      !tutorCourseCatalog_().length ||
      selectedIds.some(id=>!tutorCourseById_(id))
    ){
      loadTutorCourseCatalog_({
        force:true
      });

      toast(
        'Course list is refreshing. Please save again in a moment.',
        true
      );
      return;
    }
  }

  syncTutorStrongestHidden_();

  const strongestText=
    strongestTouched
      ? tutorStrongestNamesFromIds_(
          selectedIds
        )
      : String(
          DATA.profile?.strongestCourse||
          document.getElementById(
            'profileStrongest'
          )?.value||
          ''
        );

  const payload={
    preferredName:
      document.getElementById(
        'profilePreferred'
      ).value||'',
    notificationEmail:
      document.getElementById(
        'profileNotificationEmail'
      ).value||'',
    strongestCourse:
      strongestText,
    strongestCourseIds:
      strongestTouched
        ? selectedIds.slice()
        : [],
    strongestCourseTouched:
      strongestTouched,
    languages:
      document.getElementById(
        'profileLanguages'
      ).value||'',
    experienceDetails:
      document.getElementById(
        'profileExperience'
      ).value||'',
    directoryBio:
      document.getElementById(
        'profileDirectoryBio'
      ).value||''
  };

  const snapshotProfile={
    ...(DATA.profile||{})
  };

  const snapshotIdentity={
    ...(DATA.identity||{})
  };

  const snapshotStrongestIds=
    selectedIds.slice();

  const snapshotStrongestDirty=
    TUTOR_STRONGEST_DRAFT_DIRTY;

  const snapshotEditRevision=
    TUTOR_STRONGEST_EDIT_REVISION;

  const saveSeq=
    ++TUTOR_PROFILE_SAVE_SEQ;

  const patch={
    preferredName:
      payload.preferredName,
    notificationEmail:
      payload.notificationEmail
        .trim()
        .toLowerCase(),
    strongestCourse:
      payload.strongestCourse,
    languages:
      payload.languages,
    experienceDetails:
      payload.experienceDetails,
    directoryBio:
      payload.directoryBio
  };

  Object.assign(
    DATA.profile,
    patch
  );

  Object.assign(
    DATA.identity,
    {
      preferredName:
        patch.preferredName,
      notificationEmail:
        patch.notificationEmail
    }
  );

  TUTOR_STRONGEST_DRAFT_DIRTY=false;
  TUTOR_STRONGEST_STATE_READY=true;

  hydrateIdentity();
  renderAll();
  saveLocalCache();

  toast(
    'Profile saved. Teacher Directory will sync automatically.'
  );

  ACTIVE_SERVER_OPS++;

  google.script.run
    .withSuccessHandler(result=>{
      ACTIVE_SERVER_OPS=
        Math.max(
          0,
          ACTIVE_SERVER_OPS-1
        );

      // Ignore a response from an older Save click. A newer save owns state.
      if(
        saveSeq!==
        TUTOR_PROFILE_SAVE_SEQ
      ){
        return;
      }

      if(result?.patch){
        Object.assign(
          DATA.profile,
          result.patch
        );

        Object.assign(
          DATA.identity,
          result.patch
        );

        // Do not erase a stronger/newer draft the tutor created while this
        // server save was still in flight.
        if(
          TUTOR_STRONGEST_EDIT_REVISION===
          snapshotEditRevision
        ){
          tutorStrongestResetFromText_(
            result.patch.strongestCourse||
            DATA.profile?.strongestCourse||
            ''
          );
        }else{
          TUTOR_STRONGEST_DRAFT_DIRTY=true;
          TUTOR_STRONGEST_STATE_READY=true;
        }

        hydrateIdentity();
        renderAll();
        saveLocalCache();
      }

      quietRefresh(1200);
    })
    .withFailureHandler(error=>{
      ACTIVE_SERVER_OPS=
        Math.max(
          0,
          ACTIVE_SERVER_OPS-1
        );

      // An older failed request must never roll back a newer successful save.
      if(
        saveSeq!==
        TUTOR_PROFILE_SAVE_SEQ
      ){
        return;
      }

      DATA.profile=
        snapshotProfile;

      DATA.identity=
        snapshotIdentity;

      // Preserve any strongest-course edits made after this request began.
      if(
        TUTOR_STRONGEST_EDIT_REVISION===
        snapshotEditRevision
      ){
        TUTOR_STRONGEST_SELECTED_IDS=
          snapshotStrongestIds.slice();

        TUTOR_STRONGEST_DRAFT_DIRTY=
          snapshotStrongestDirty;

        TUTOR_STRONGEST_STATE_READY=true;
      }else{
        TUTOR_STRONGEST_DRAFT_DIRTY=true;
        TUTOR_STRONGEST_STATE_READY=true;
      }

      hydrateIdentity();
      renderAll();
      saveLocalCache();

      toast(

function rebuildLocal(){
  const requests=DATA.requests||[];
  const today=startOfDay(new Date());

  DATA.upcoming=requests
    .filter(tutorIsUpcomingSessionV34_)
    .sort((a,b)=>
      String(a.scheduledDate||'')
        .localeCompare(String(b.scheduledDate||''))
    );

  DATA.pastSessions=requests
    .filter(tutorIsPastSessionV34_)
    .sort((a,b)=>
      String(b.scheduledDate||'')
        .localeCompare(String(a.scheduledDate||''))
    );

  const activeCaseloadRequests=
    dedupeTutorRequestsV37_(requests)
      .filter(r=>{
        const status=
          normalizeTutorStatusV34_(
            r&&r.status
          );

        return (
          !['cancelled','completed']
            .includes(status) &&
          !tutorIsPastSessionV34_(r)
        );
      });

  const verifiedSessions=(DATA.sessions||[])
    .filter(s=>
      s&&
      s.result==='Completed'&&
      s.verificationStatus==='Verified'
    );

  const verifiedMinutes=verifiedSessions.reduce(
    (sum,s)=>sum+Number(s.verifiedMinutes||0),
    0
  );

  const verifiedHours=
    Math.round((verifiedMinutes/60)*100)/100;

  const pendingVerification=(DATA.sessions||[])
    .filter(s=>
      s&&
      s.result==='Completed'&&
      s.verificationStatus==='Pending'
    ).length;

  DATA.profile={
    ...(DATA.profile||{}),
    sessionsCompleted:verifiedSessions.length,
    verifiedHours:verifiedHours
  };

  DATA.counts={
    ...(DATA.counts||{}),
    pendingAcceptance:
      requests.filter(needsAcceptance).length,
    upcoming:DATA.upcoming.length,
    sessionsCompleted:verifiedSessions.length,
    verifiedHours:verifiedHours,
    pendingVerification:pendingVerification,
    pendingReports:requests.filter(r=>{
      const status=normalizeTutorStatusV34_(r&&r.status);
      const response=String(r&&r.tutorResponseStatus||"")
        .trim()
        .toLowerCase();

      return (
        tutorIsConfirmedSessionV34_(r) &&
        response==="accepted" &&
        !['completed','cancelled','pending verification']
          .includes(status) &&
        tutorSessionHasEndedV34_(r)
      );
    }).length,

    // V37: do not trust Tutor Database Current Caseload for portal display.
    // It can lag behind request deletion/cancellation. Live requests are the
    // authoritative UI source.
    currentCaseload:activeCaseloadRequests.length
  };
}

function canReport(r){
  if(!r||!r.scheduledDate)return false;

  const response=String(

  if(response!=="accepted")return false;

  const status=normalizeTutorStatusV34_(r.status);

  if(
    ['completed','cancelled','pending verification']
      .includes(status)

  return tutorSessionHasEndedV34_(r);
}

/* =========================================================
   V25 MAX RESPONSIVENESS — TUTOR
   ========================================================= */

function v25CheckForChanges_(){
  if(!TUTOR_AUTHORIZED || document.visibilityState!=="visible" || V25_REVISION_IN_FLIGHT) return;

  V25_REVISION_IN_FLIGHT=true;

  google.script.run
    .withSuccessHandler(revision=>{
      V25_REVISION_IN_FLIGHT=false;
      V473_SYNC_FAILURES=0;
      const next=String(revision||"0");

      if(V25_REVISION!=="0" && next!==V25_REVISION){
        V25_REVISION=next;
        v28FastTutorRequestSync_();

        // Keep assignments authoritative immediately, but rate-limit the
        // heavier profile/session/notification refresh when unrelated users
        // mutate the global revision.
        if(Date.now()-V25_LAST_FULL_SYNC>60000){
          window.setTimeout(()=>{
            if(
              document.visibilityState==="visible" &&
              !TUTOR_REFRESH_IN_FLIGHT &&
              ACTIVE_SERVER_OPS===0
            ){
              loadPortal(false,{silent:true});
            }
          },650);
        }

        return;
      }

      V25_REVISION=next;

      if(Date.now()-V25_LAST_FULL_SYNC>AUTO_REFRESH_MS){
        loadPortal(false,{silent:true});
      }
    })
    .withFailureHandler(error=>{
      V25_REVISION_IN_FLIGHT=false;
      const message=String(error&&error.message?error.message:error||'');
      if(message.includes('ACCESS_DENIED')||message.includes('LOGIN_REQUIRED')){
        showTutorAccessGate(message);
        return;
      }
      V473_SYNC_FAILURES=Math.min(5,V473_SYNC_FAILURES+1);
    })
    .nhs_getDataRevision();
}


function v28FastTutorRequestSync_(){
  if(V36_TUTOR_REQUEST_SYNC_IN_FLIGHT){
    V36_TUTOR_REQUEST_SYNC_QUEUED=true;
    return;
  }

  V36_TUTOR_REQUEST_SYNC_IN_FLIGHT=true;

  google.script.run
    .withSuccessHandler(delta=>{
      V36_TUTOR_REQUEST_SYNC_IN_FLIGHT=false;
      V473_SYNC_FAILURES=0;

      if(delta){
        // Authoritative replacement. [] means the tutor currently owns zero
        // requests, so old cached assignments/upcoming rows are removed.
        DATA.requests=
          dedupeTutorRequestsV37_(
            Array.isArray(delta.requests)
              ? delta.requests
              : []
          );

        V37_TUTOR_REQUEST_AUTHORITY_READY=true;
        V42_REQUEST_TRUTH_READY=true;
        V42_REQUEST_SYNC_FAILED=false;

        DATA.requestAuthoritySource=delta.source||"Tutoring Requests";
        DATA.requestAuthorityAt=delta.generatedAt||new Date().toISOString();
        DATA.requestAuthorityBuild=delta.buildVersion||TUTOR_BUILD_VERSION;

        rebuildLocal();

        // Independent server-side lifecycle guard.
        if(delta.counts){
          DATA.counts.pendingAcceptance=
            Number(delta.counts.pendingActions||0);
          DATA.counts.upcoming=
            Number(delta.counts.upcoming||0);
          DATA.counts.currentCaseload=
            Number(delta.counts.currentCaseload||0);

          const allowed=new Set(
            Array.isArray(delta.upcomingRequestIds)
              ? delta.upcomingRequestIds
              : []
          );

          DATA.upcoming=(DATA.requests||[])
            .filter(r=>allowed.has(r.requestId))
            .sort((a,b)=>
              String(a.scheduledDate||"")
                .localeCompare(String(b.scheduledDate||""))
            );
        }

        LAST_SYNC=Date.now();
        V41_TUTOR_LAST_REQUEST_SYNC=LAST_SYNC;

        renderAll();
        saveLocalCache();
        updateSyncLabel();
      }

      if(V36_TUTOR_REQUEST_SYNC_QUEUED){
        V36_TUTOR_REQUEST_SYNC_QUEUED=false;
        v28FastTutorRequestSync_();
      }
    })
    .withFailureHandler(()=>{
      V36_TUTOR_REQUEST_SYNC_IN_FLIGHT=false;
      V473_SYNC_FAILURES=Math.min(5,V473_SYNC_FAILURES+1);

      if(V36_TUTOR_REQUEST_SYNC_QUEUED){
        V36_TUTOR_REQUEST_SYNC_QUEUED=false;
        v28FastTutorRequestSync_();
        return;
      }

      // V44: a failed safety check must never erase a successfully loaded
      // assignment list. Preserve the last good state and retry.
      DATA.requestSyncError=true;
      V42_REQUEST_SYNC_FAILED=true;

      rebuildLocal();
      renderAll();
      updateSyncLabel(true);

      window.setTimeout(()=>{
        if(
          document.visibilityState==="visible" &&
          !V36_TUTOR_REQUEST_SYNC_IN_FLIGHT
        ){
          v28FastTutorRequestSync_();
        }
      },Math.min(
        NHS_SYNC_ERROR_MAX_MS,
        NHS_SYNC_ACTIVE_REVISION_MS*Math.pow(2,Math.min(V473_SYNC_FAILURES,3))
      ));
    })
    .tutor_getAuthoritativeRequestStateV42();
}


/* =========================================================
   V34 REQUEST LIFECYCLE + PAST SESSION ARCHIVE
   ========================================================= */

function normalizeTutorStatusV34_(value){
  return String(value||'')
    .trim()
    .toLowerCase();
}

function tutorSessionEndMinutesV34_(timeText){
  const text=String(timeText||'').trim();
  const matches=text.match(
    /\b(\d{1,2}):(\d{2})\s*(AM|PM)\b/gi
  );

  if(!matches||!matches.length){
    return 11*60+5;
  }

  const last=matches[matches.length-1].match(
    /(\d{1,2}):(\d{2})\s*(AM|PM)/i
  );

  if(!last)return 11*60+5;

  let hour=Number(last[1]);
  const minute=Number(last[2]);
  const meridiem=String(last[3]).toUpperCase();

  if(hour===12)hour=0;
  if(meridiem==='PM')hour+=12;

  return hour*60+minute;
}

function tutorSessionHasEndedV34_(request){
  if(!request||!request.scheduledDate)return false;

  const dateKey=String(request.scheduledDate).trim();
  const now=new Date();

  const todayKey=[
    now.getFullYear(),
    String(now.getMonth()+1).padStart(2,'0'),
    String(now.getDate()).padStart(2,'0')
  ].join('-');

  if(dateKey<todayKey)return true;
  if(dateKey>todayKey)return false;

  const nowMinutes=
    now.getHours()*60+
    now.getMinutes();

  return nowMinutes>=
    tutorSessionEndMinutesV34_(
      request.scheduledTime||
      DATA.titanTime||
      '10:25 AM–11:05 AM'
    );
}

function tutorIsCancelledV34_(request){
  return normalizeTutorStatusV34_(
    request&&request.status
  )==='cancelled';
}

function tutorHasConfirmedAssignmentV40_(request){
  if(!request)return false;

  if(typeof request.isConfirmed==="boolean"){
    return request.isConfirmed;
  }

  const raw=String(
    request.assignmentConfirmed||""
  ).trim();

  if(!raw)return false;

  return ![
    "false",
    "0",
    "no",
    "unchecked",
    "pending"
  ].includes(raw.toLowerCase());
}


function tutorIsConfirmedSessionV34_(request){
  // V40 lifecycle contract:
  // "Scheduled" means a date/time has been placed on the request.
  // It does NOT mean the officer has confirmed/notified the assignment.
  return !!(
    request &&
    request.scheduledDate &&
    tutorHasConfirmedAssignmentV40_(request)
  );
}

function tutorIsPastSessionV34_(request){
  return (
    tutorIsConfirmedSessionV34_(request) &&
    !tutorIsCancelledV34_(request) &&
    tutorSessionHasEndedV34_(request)
  );
}

function tutorIsUpcomingSessionV34_(request){
  const status=
    normalizeTutorStatusV34_(
      request&&request.status
    );

  return (
    tutorIsConfirmedSessionV34_(request) &&
    !tutorIsCancelledV34_(request) &&
    status!=='completed' &&
    !tutorSessionHasEndedV34_(request)
  );
}


/* =========================================================
   V36 AUTHORITATIVE LIVE REQUEST HEARTBEAT — TUTOR
   ========================================================= */
function dedupeTutorRequestsV37_(rows){
  const seen=new Map();

  (Array.isArray(rows)?rows:[]).forEach(r=>{
    const id=String(r&&r.requestId||'').trim();
    if(!id)return;
    seen.set(id,r);
  });

  return Array.from(seen.values());
}


/* =========================================================
   V41 STABLE SYNC ENGINE — TUTOR
   ========================================================= */


function v41StartTutorSyncEngine_(){
  if(V41_TUTOR_SYNC_ENGINE_STARTED)return;
  V41_TUTOR_SYNC_ENGINE_STARTED=true;

  let timer=null;
  let lastActivity=Date.now();
  const noteActivity=()=>{lastActivity=Date.now();};
  ['pointerdown','keydown','touchstart','scroll'].forEach(type=>{
    window.addEventListener(type,noteActivity,{passive:true});
  });

  const nextDelay=()=>{
    if(document.visibilityState!=='visible')return NHS_SYNC_HIDDEN_RECHECK_MS;
    const base=Date.now()-lastActivity<60000
      ? NHS_SYNC_ACTIVE_REVISION_MS
      : NHS_SYNC_IDLE_REVISION_MS;
    if(!V473_SYNC_FAILURES)return base;
    return Math.min(NHS_SYNC_ERROR_MAX_MS,base*Math.pow(2,Math.min(V473_SYNC_FAILURES,3)));
  };

  const schedule=(delay)=>{
    window.clearTimeout(timer);
    timer=window.setTimeout(tick,Math.max(1000,Number(delay||nextDelay())));
  };

  const tick=()=>{
    if(!TUTOR_AUTHORIZED)return;
    if(document.visibilityState!=='visible'){
      schedule();
      return;
    }
    if(ACTIVE_SERVER_OPS>0||TUTOR_REFRESH_IN_FLIGHT||V25_REVISION_IN_FLIGHT){
      schedule(5000);
      return;
    }

    v25CheckForChanges_();
    if(
      !V36_TUTOR_REQUEST_SYNC_IN_FLIGHT &&
      Date.now()-V41_TUTOR_LAST_REQUEST_SYNC>=NHS_SYNC_AUTHORITATIVE_FALLBACK_MS
    ){
      v28FastTutorRequestSync_();
    }
    schedule();
  };

  window.setTimeout(v25CheckForChanges_,1200);
  window.setTimeout(()=>{
    if(document.visibilityState==='visible')v28FastTutorRequestSync_();
  },1800);
  schedule(NHS_SYNC_ACTIVE_REVISION_MS);

  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'){
      lastActivity=Date.now();
      v25CheckForChanges_();
      schedule(1500);
    }else{
      schedule(NHS_SYNC_HIDDEN_RECHECK_MS);
    }
  });

  window.addEventListener('online',()=>{
    V473_SYNC_FAILURES=0;
    v25CheckForChanges_();
    schedule(1500);
  });
}

// V46.2 deterministic startup: initialize only after the entire script/DOM exists.
if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", startTutorPortal_, {once:true});
}else{
  startTutorPortal_();
}
